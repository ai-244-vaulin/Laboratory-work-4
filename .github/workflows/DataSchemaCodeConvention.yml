name: DataSchema Code Convention
on:
  push:
    branches: main
jobs:
  json_linter_test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: "actions/checkout@v3"
      - name: Start JSON Linter
        run: |
          npm install --global @sourcemeta/jsonschema
          jsonschema validate DataSchemaModified.json test.json
